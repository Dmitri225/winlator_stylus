name: Knox mechanism test (Android 15 emulator)

on:
  push:
    branches: [ knox-support ]
    paths: [ 'ci/knox_mech_test.sh', '.github/workflows/knox-mechanism-test.yml' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download a debuggable com.winlator APK (for run-as)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download knox-build-10 -R "$GITHUB_REPOSITORY" -p '*.apk' -D apk
          ls -la apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mechanism tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apk/*.apk
            bash ci/knox_mech_test.sh
