name: Build Winlator S Pen APK

on:
  push:
    branches: [ spen-stylus ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_REPO: brunodev85/winlator
      UPSTREAM_TAG: v10.1.0
      # sha256 of app/src/main/assets/imagefs.txz at v10.1.0 (from the Git LFS pointer)
      IMAGEFS_SHA256: 00a283c7d3e9ed2399b8d73175f92a3932b65e86925f7a5bd0fe0d4736e81e8a
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Get imagefs.txz (official release first, Git LFS as fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          dst="$GITHUB_WORKSPACE/app/src/main/assets/imagefs.txz"
          mkdir -p /tmp/upstream && cd /tmp/upstream
          echo "== release assets of $UPSTREAM_REPO $UPSTREAM_TAG"
          gh release view "$UPSTREAM_TAG" -R "$UPSTREAM_REPO" --json assets -q '.assets[]|.name+"  "+(.size|tostring)' || true
          gh release download "$UPSTREAM_TAG" -R "$UPSTREAM_REPO" || true
          ls -la
          found=""
          check() { [ -f "$1" ] && [ "$(sha256sum "$1" | cut -d' ' -f1)" = "$IMAGEFS_SHA256" ] && found="$1"; true; }
          for f in *; do check "$f"; done
          for apk in *.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk entries matching imagefs/large assets"
            unzip -l "$apk" | awk '$1 > 1000000 || /imagefs/' || true
            for e in $(unzip -Z1 "$apk" | grep -i imagefs || true); do
              unzip -o -q "$apk" "$e" -d x
              check "x/$e"
            done
          done
          if [ -n "$found" ]; then
            echo "imagefs found in release: $found"
            cp "$found" "$dst"
          else
            echo "Not in release, falling back to Git LFS of $UPSTREAM_REPO"
            cd "$GITHUB_WORKSPACE"
            git lfs install --local
            git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
            git config lfs.url "https://github.com/$UPSTREAM_REPO.git/info/lfs"
            git lfs pull --include="app/src/main/assets/imagefs.txz"
          fi
          echo "$IMAGEFS_SHA256  $dst" | sha256sum -c -
          ls -la "$dst"

      - name: Fetch OpenXR-SDK submodule (gitlink without .gitmodules upstream)
        run: |
          set -e
          d=app/src/main/cpp/OpenXR-SDK
          sha=$(git ls-tree HEAD "$d" | awk '{print $3}')
          echo "OpenXR-SDK pinned at $sha"
          rm -rf "$d" && mkdir -p "$d" && cd "$d"
          git init -q
          git fetch -q --depth 1 https://github.com/KhronosGroup/OpenXR-SDK "$sha"
          git checkout -q FETCH_HEAD
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/Winlator_10.1_SPen_${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: winlator-spen-apk
          path: out/*.apk

      - name: Publish release (easy download from phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="spen-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Winlator 10.1 + S Pen (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from $GITHUB_SHA. Package com.winlator: uninstall official Winlator first (back up containers)."
