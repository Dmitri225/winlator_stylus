name: Verify APK install (Android 15 emulator)

on:
  push:
    branches: [ spen-11.2 ]
    paths: [ '.github/workflows/verify-install.yml', 'ci/verify-tag.txt' ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download APK from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat ci/verify-tag.txt)
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.apk' -D apk
          ls -la apk && sha256sum apk/*.apk

      - name: Signature and manifest
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs apk/*.apk
          "$BT/aapt2" dump badging apk/*.apk | grep -E "^package|sdkVersion|targetSdkVersion|native-code|uses-permission" || true
          echo "== zipalign check"; "$BT/zipalign" -c -v 4 apk/*.apk | tail -3 || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 15 (API 35) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abilist
            adb install -r apk/*.apk 2>&1 | tee install.log
            adb shell pm list packages | grep winlator || (echo "NOT INSTALLED"; exit 1)
            adb shell dumpsys package com.winlator | grep -E "versionName|versionCode|targetSdk|primaryCpuAbi" | head
            adb logcat -c
            adb shell am start -W -n com.winlator/.MainActivity
            sleep 20
            adb shell pidof com.winlator && echo "PROCESS RUNNING" || echo "PROCESS NOT RUNNING"
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|com.winlator" | head -40 || true
